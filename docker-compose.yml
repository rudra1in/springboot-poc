version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamex
      POSTGRES_USER: gamex
      POSTGRES_PASSWORD: gamex
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamex']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./gamex-backend
    ports:
      - '8080:8080'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gamex
      DB_USER: gamex
      DB_PASSWORD: gamex
      JWT_SECRET: change-me-in-production-min-32-chars!
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./gamex-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  pgdata:
